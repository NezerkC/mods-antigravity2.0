name: Seed Project Backlog

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed:
    name: Seed Issues & Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Seed Project Labels and Backlog Tasks
        uses: actions/github-script@v7
        with:
          script: |
            const seed = require('./.github/scripts/seed_backlog.cjs');
            await seed({ github, context });
